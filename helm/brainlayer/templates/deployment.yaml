apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brainlayer.fullname" . }}
  labels:
    {{- include "brainlayer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "brainlayer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "brainlayer.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: daemon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: BRAINLAYER_DATA_DIR
              value: /data/brainlayer
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data/brainlayer
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "brainlayer.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
